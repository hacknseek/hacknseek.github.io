<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuner - HackNSeek</title>
    <meta name="description" content="A chromatic instrument tuner">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../styles.css">
    <style>
        .app-page {
            max-width: 500px;
            margin: 0 auto;
        }

        .tuner-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .note-display {
            margin-bottom: 30px;
        }

        .note-name {
            font-size: 6rem;
            font-weight: bold;
            display: block;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            line-height: 1;
        }

        .note-name.sharp {
            color: #ffd700;
        }

        .frequency {
            font-size: 1.5rem;
            opacity: 0.8;
            margin-top: 10px;
        }

        .tuner-meter {
            position: relative;
            width: 100%;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            margin: 30px 0;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .meter-center {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #fff;
            transform: translateX(-50%);
            z-index: 2;
        }

        .meter-needle {
            position: absolute;
            top: 5px;
            bottom: 5px;
            width: 8px;
            background: linear-gradient(to bottom, #ff6b6b, #ffd700);
            border-radius: 4px;
            left: 50%;
            transform: translateX(-50%);
            transition: left 0.1s ease-out;
            z-index: 1;
        }

        .meter-labels {
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .cents-display {
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .cents-display.in-tune {
            color: #4ade80;
        }

        .cents-display.sharp {
            color: #ff6b6b;
        }

        .cents-display.flat {
            color: #60a5fa;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            border: none;
            border-radius: 30px;
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.4);
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.6);
        }

        .start-btn.active {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .pitch-reference {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .pitch-reference label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .pitch-reference select {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            padding: 10px 15px;
            font-size: 1rem;
            cursor: pointer;
            outline: none;
        }

        .pitch-reference select option {
            background: #333;
            color: white;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../../" class="back-link">← Back to Apps</a>

        <main class="app-page">
            <div class="tuner-container">
                <div class="error-message" id="errorMessage">
                    Microphone access denied. Please allow microphone access to use the tuner.
                </div>

                <div class="note-display">
                    <span class="note-name" id="noteName">--</span>
                    <div class="frequency" id="frequency">0 Hz</div>
                </div>

                <div class="tuner-meter">
                    <div class="meter-center"></div>
                    <div class="meter-needle" id="meterNeedle"></div>
                </div>
                <div class="meter-labels">
                    <span>Flat</span>
                    <span>In Tune</span>
                    <span>Sharp</span>
                </div>

                <div class="cents-display" id="centsDisplay">0 cents</div>

                <button class="start-btn" id="startBtn">Start Tuner</button>

                <div class="pitch-reference">
                    <label for="a4Frequency">A4 Reference (Hz):</label>
                    <select id="a4Frequency">
                        <option value="432">432 Hz</option>
                        <option value="440" selected>440 Hz</option>
                        <option value="442">442 Hz</option>
                        <option value="444">444 Hz</option>
                    </select>
                </div>
            </div>
        </main>

        <footer>
            <p>Play your instrument to tune</p>
        </footer>
    </div>

    <script src="script.js?v=3"></script>
</body>
</html>
