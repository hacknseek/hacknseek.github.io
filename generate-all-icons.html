<!DOCTYPE html>
<html>
<head>
    <title>Generate All Metronome Icons</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .icon-item { text-align: center; border: 1px solid #ddd; padding: 10px; border-radius: 8px; }
        .icon-item img { max-width: 100px; height: auto; }
        .download-btn { display: inline-block; margin-top: 10px; padding: 8px 16px; background: #6366f1; color: white; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Metronome PWA Icons</h1>
    <p>Right-click each icon and "Save image as..." to save them to the icons folder with the correct filename.</p>
    
    <div class="icon-grid" id="iconGrid"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const iconGrid = document.getElementById('iconGrid');
        
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background circle with gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#8b5cf6');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 10, 0, 2 * Math.PI);
            ctx.fill();
            
            // White border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = Math.max(2, size/48);
            ctx.stroke();
            
            // Inner white circle
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 30, 0, 2 * Math.PI);
            ctx.fill();
            
            // Metronome pendulum
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = Math.max(2, size/24);
            ctx.beginPath();
            ctx.moveTo(size/2, size/2 - size/4);
            ctx.lineTo(size/2, size/2 + size/4);
            ctx.stroke();
            
            // Pendulum weight
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.arc(size/2, size/2 + size/4, size/12, 0, 2 * Math.PI);
            ctx.fill();
            
            // Musical note
            ctx.fillStyle = '#6366f1';
            ctx.font = `bold ${size/4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('♪', size/2, size/2 - size/8);
            
            // Create icon item
            const iconItem = document.createElement('div');
            iconItem.className = 'icon-item';
            
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            img.alt = `${size}x${size} icon`;
            
            const filename = `icon-${size}x${size}.png`;
            const downloadLink = document.createElement('a');
            downloadLink.href = canvas.toDataURL('image/png');
            downloadLink.download = filename;
            downloadLink.className = 'download-btn';
            downloadLink.textContent = `Download ${filename}`;
            
            const title = document.createElement('h3');
            title.textContent = `${size}×${size}`;
            
            iconItem.appendChild(title);
            iconItem.appendChild(img);
            iconItem.appendChild(downloadLink);
            
            iconGrid.appendChild(iconItem);
        }
        
        // Generate all icons
        sizes.forEach(createIcon);
        
        // Auto-download all icons
        setTimeout(() => {
            const downloadLinks = document.querySelectorAll('.download-btn');
            downloadLinks.forEach((link, index) => {
                setTimeout(() => {
                    link.click();
                }, index * 500); // Stagger downloads
            });
        }, 1000);
    </script>
</body>
</html>
