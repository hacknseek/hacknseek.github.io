<!DOCTYPE html>
<html>
<head>
    <title>Create 512x512 Icon</title>
</head>
<body>
    <canvas id="canvas" width="512" height="512"></canvas>
    <br>
    <a id="download" download="icon-512x512.png">Download 512x512 Icon</a>
    
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        // Background circle with gradient
        const gradient = ctx.createLinearGradient(0, 0, 512, 512);
        gradient.addColorStop(0, '#6366f1');
        gradient.addColorStop(1, '#8b5cf6');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(256, 256, 246, 0, 2 * Math.PI);
        ctx.fill();
        
        // White border
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        ctx.stroke();
        
        // Inner white circle
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(256, 256, 176, 0, 2 * Math.PI);
        ctx.fill();
        
        // Metronome pendulum
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 20;
        ctx.beginPath();
        ctx.moveTo(256, 128);
        ctx.lineTo(256, 384);
        ctx.stroke();
        
        // Pendulum weight
        ctx.fillStyle = '#6366f1';
        ctx.beginPath();
        ctx.arc(256, 384, 42, 0, 2 * Math.PI);
        ctx.fill();
        
        // Musical note
        ctx.fillStyle = '#6366f1';
        ctx.font = 'bold 128px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('♪', 256, 192);
        
        // Set up download
        const downloadLink = document.getElementById('download');
        downloadLink.href = canvas.toDataURL('image/png');
    </script>
</body>
</html>
