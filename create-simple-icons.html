<!DOCTYPE html>
<html>
<head>
    <title>Create Simple Icons</title>
</head>
<body>
    <h1>Metronome PWA Icons</h1>
    <p>Right-click each icon below and "Save image as..." to save them to the icons folder.</p>
    
    <div id="icons"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const iconsContainer = document.getElementById('icons');
        
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background circle with gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#6366f1');
            gradient.addColorStop(1, '#8b5cf6');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 10, 0, 2 * Math.PI);
            ctx.fill();
            
            // White border
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 4;
            ctx.stroke();
            
            // Inner white circle
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(size/2, size/2, size/2 - 30, 0, 2 * Math.PI);
            ctx.fill();
            
            // Metronome pendulum
            ctx.strokeStyle = '#6366f1';
            ctx.lineWidth = Math.max(2, size/20);
            ctx.beginPath();
            ctx.moveTo(size/2, size/2 - size/4);
            ctx.lineTo(size/2, size/2 + size/4);
            ctx.stroke();
            
            // Pendulum weight
            ctx.fillStyle = '#6366f1';
            ctx.beginPath();
            ctx.arc(size/2, size/2 + size/4, size/12, 0, 2 * Math.PI);
            ctx.fill();
            
            // Musical note
            ctx.fillStyle = '#6366f1';
            ctx.font = `bold ${size/4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('♪', size/2, size/2 - size/8);
            
            // Create download link
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.innerHTML = `
                <div style="display: inline-block; margin: 10px; text-align: center;">
                    <img src="${canvas.toDataURL('image/png')}" style="width: 64px; height: 64px; border: 1px solid #ccc;">
                    <br>
                    <small>icon-${size}x${size}.png</small>
                </div>
            `;
            
            iconsContainer.appendChild(link);
        }
        
        sizes.forEach(createIcon);
    </script>
</body>
</html>
