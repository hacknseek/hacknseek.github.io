<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HackNSeek">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- stylized "HN" monogram + waveform hint -->
  <g fill="url(#f)">
    <!-- left bar of H -->
    <rect x="120" y="120" width="44" height="272" rx="10"/>
    <!-- right bar of H -->
    <rect x="348" y="120" width="44" height="272" rx="10"/>
    <!-- crossbar of H -->
    <rect x="164" y="232" width="184" height="48" rx="14"/>
  </g>
  <!-- waveform overlay -->
  <g fill="#ffffff" fill-opacity="0.85">
    <rect x="170" y="402" width="14" height="36" rx="4"/>
    <rect x="192" y="384" width="14" height="72" rx="4"/>
    <rect x="214" y="358" width="14" height="124" rx="4"/>
    <rect x="236" y="372" width="14" height="96" rx="4"/>
    <rect x="258" y="346" width="14" height="148" rx="4"/>
    <rect x="280" y="372" width="14" height="96" rx="4"/>
    <rect x="302" y="384" width="14" height="72" rx="4"/>
    <rect x="324" y="402" width="14" height="36" rx="4"/>
  </g>
</svg>
