<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackNSeek Apps</title>
    <meta name="description" content="A collection of useful web apps">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>HackNSeek</h1>
            <p class="subtitle">Web Apps Collection</p>
        </header>

        <main>
            <div class="apps-grid">
                <a href="apps/metronome/" class="app-card">
                    <div class="app-icon">🎵</div>
                    <h2>Metronome</h2>
                    <p>Keep the beat with adjustable BPM and time signatures</p>
                </a>

                <a href="apps/tuner/" class="app-card">
                    <div class="app-icon">🎹</div>
                    <h2>Tuner</h2>
                    <p>Chromatic instrument tuner with visual meter</p>
                </a>

                <div class="app-card coming-soon">
                    <div class="app-icon">⏱️</div>
                    <h2>Timer</h2>
                    <p>Countdown and interval timer</p>
                    <span class="badge">Coming Soon</span>
                </div>

                <div class="app-card coming-soon">
                    <div class="app-icon">📐</div>
                    <h2>Tap Tempo</h2>
                    <p>BPM tap tempo detector</p>
                    <span class="badge">Coming Soon</span>
                </div>
            </div>
        </main>

        <footer>
            <p>More apps coming soon</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
